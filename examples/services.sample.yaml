# Sample config for chronexa-ws-manager --config
#
# Usage:
#   chronexa-ws-manager.exe create   --config services.yaml
#   chronexa-ws-manager.exe edit     --config services.yaml
#   chronexa-ws-manager.exe start    --config services.yaml
#   chronexa-ws-manager.exe stop     --config services.yaml
#   chronexa-ws-manager.exe restart  --config services.yaml
#   chronexa-ws-manager.exe delete   --config services.yaml
#   chronexa-ws-manager.exe query    --config services.yaml
#
# "create" skips any service that already exists and reports it as such;
# it never overwrites an existing service. Use "edit" to update one.
#
# "path" points straight at the real executable/script — no wrapper needed.
# Every service this tool creates runs under its own built-in service host,
# which spawns "path" (with "args", in "workdir") as a supervised child.

services:
  - name: ChronexaApiGateway
    path: "C:\\Program Files\\nodejs\\node.exe"
    args: "server.js --port 8080"
    workdir: "C:\\Chronexa\\api-gateway"
    logdir: "C:\\ProgramData\\Chronexa\\logs"
    start: auto
    account:
      type: LocalSystem

  - name: ChronexaWorker
    path: "C:\\Program Files\\nodejs\\node.exe"
    args: "worker.js --queue default"
    workdir: "C:\\Chronexa\\worker"
    logdir: "C:\\ProgramData\\Chronexa\\logs"
    start: delayed-auto
    account:
      type: NetworkService

  # Custom logon account example. Keep the password out of source control —
  # ${CHRONEXA_SVC_PASSWORD} is expanded from the environment at run time.
  - name: ChronexaScheduler
    path: "C:\\Program Files\\nodejs\\node.exe"
    args: "scheduler.js"
    workdir: "C:\\Chronexa\\scheduler"
    logdir: "C:\\ProgramData\\Chronexa\\logs"
    start: auto
    account:
      type: Custom
      username: ".\\svc_chronexa"
      password: "${CHRONEXA_SVC_PASSWORD}"

  # Manual-start service, no dedicated log directory or working directory.
  - name: ChronexaMaintenanceTool
    path: "C:\\Chronexa\\tools\\maintenance.exe"
    start: demand
