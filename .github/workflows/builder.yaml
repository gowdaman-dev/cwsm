name: Builder

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build CWSM (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [ x64, Win32 ]
        configuration: [ Release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build CWSM
        run: |
          msbuild cwsm.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /v:m

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cwsm-${{ matrix.platform }}
          path: |
            out/${{ matrix.configuration }}/**/cwsm.exe
            out/${{ matrix.configuration }}/**/cwsm.pdb
