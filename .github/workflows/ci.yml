name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build service host
        working-directory: service-host/ChronexaServiceHost
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./publish

      - name: Copy host into CLI assets
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item service-host/ChronexaServiceHost/publish/chronexa-service-host.exe assets/chronexa-service-host.exe -Force

      - name: Install CLI dependencies
        run: npm ci

      - name: Build CLI exe
        run: npm run build:exe

      - name: Service lifecycle smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist/chronexa-ws-manager.exe"
          $svc = "ChronexaSmokeTest"

          Write-Host "== create =="
          & $exe create -n $svc -p "C:\Windows\System32\cmd.exe" -a "/c ping -t 127.0.0.1 >NUL" -s demand
          if ($LASTEXITCODE -ne 0) { throw "create failed" }

          Write-Host "== start =="
          & $exe start -n $svc
          if ($LASTEXITCODE -ne 0) { throw "start failed" }

          Start-Sleep -Seconds 2

          Write-Host "== query (expect RUNNING) =="
          $status = & $exe query -n $svc
          $status | Write-Host
          if (-not ($status -join "`n" | Select-String "RUNNING")) { throw "service did not reach RUNNING state" }

          Write-Host "== restart =="
          & $exe restart -n $svc
          if ($LASTEXITCODE -ne 0) { throw "restart failed" }
          Start-Sleep -Seconds 2
          $status = & $exe query -n $svc
          if (-not ($status -join "`n" | Select-String "RUNNING")) { throw "service did not reach RUNNING state after restart" }

          Write-Host "== stop =="
          & $exe stop -n $svc
          if ($LASTEXITCODE -ne 0) { throw "stop failed" }

          Write-Host "== delete =="
          & $exe delete -n $svc
          if ($LASTEXITCODE -ne 0) { throw "delete failed" }

          Write-Host "Smoke test passed."

      - name: Cleanup leftover service (best effort)
        if: always()
        shell: pwsh
        run: |
          sc.exe stop ChronexaSmokeTest 2>$null
          sc.exe delete ChronexaSmokeTest 2>$null
          exit 0
