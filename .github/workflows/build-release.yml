name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Clean previous build output
        run: rm -rf dist service-host/ChronexaServiceHost/publish assets

      - name: Build service host
        working-directory: service-host/ChronexaServiceHost
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish

      - name: Copy host into CLI assets
        run: |
          mkdir -p assets
          cp service-host/ChronexaServiceHost/publish/chronexa-service-host.exe assets/chronexa-service-host.exe

      - name: Install dependencies
        run: npm ci

      - name: Build Windows exe
        run: npm run build:exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronexa-ws-manager-exe
          path: dist/chronexa-ws-manager.exe
          overwrite: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Chronexa WS Manager ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/chronexa-ws-manager.exe
